<ion-header class="ion-no-border">
  <ion-toolbar color="light">
    <ion-title>Editar Perfil</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cerrar()">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  
  <form [formGroup]="formulario" (ngSubmit)="guardar()">
    
    <div class="avatar-edit-container">
      <div class="avatar-wrapper" (click)="seleccionarOrigenImagen()">
        <img [src]="imagenPreview || 'assets/icon/login.png'" alt="Avatar Preview">
        <div class="camera-overlay">
          <ion-icon name="camera-outline"></ion-icon>
        </div>
      </div>
      <p class="change-photo-text" (click)="seleccionarOrigenImagen()">Cambiar foto</p>
      <input type="hidden" formControlName="photoURL">
    </div>

    <div class="form-fields">
      
      <ion-item class="custom-input" lines="none">
        <ion-label position="stacked">Nombre</ion-label>
        <ion-input formControlName="nombre" type="text" placeholder="Tu nombre"></ion-input>
        <ion-icon slot="start" name="person-outline" class="input-icon"></ion-icon>
      </ion-item>

      <ion-item class="custom-input" lines="none">
        <ion-label position="stacked">Apellidos</ion-label>
        <ion-input formControlName="apellidos" type="text" placeholder="Tus apellidos"></ion-input>
        <ion-icon slot="start" name="person-outline" class="input-icon"></ion-icon>
      </ion-item>

    </div>

    <div class="actions">
      <ion-button expand="block" type="submit" shape="round" class="save-btn" [disabled]="formulario.invalid">
        <ion-icon slot="start" name="save-outline"></ion-icon>
        Guardar Cambios
      </ion-button>
    </div>

  </form>

</ion-content>
